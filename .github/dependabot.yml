# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    # Grouping does not synchronize releases: Vite+ may bundle an older Vitest.
    # Upgrade coverage manually with Vite+; see docs/dependabot-auto-merge.md.
    ignore:
      - dependency-name: "@vitest/coverage-v8"
    groups:
      # Vite Plus bundles Vitest; coverage providers must match that version.
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
      # React requires react and react-dom to share the exact same version.
      # Keep them in one group so they are always upgraded together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Look for workflow files in the repository root
    directory: "/"
    # Check for Actions updates every week
    schedule:
      interval: "weekly"
