<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Content is rewritten by the pre-paint script and useTheme so the
         browser chrome follows the resolved (possibly manual) theme. -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="keywords" content="math,problem generator,education,practice,PDF" />
    <meta
      name="description"
      content="MathGenie is a modern web application built with React 19 and TypeScript, designed to help tutors generate math problems focusing on basic arithmetic operations. Customize number ranges, operations, and generate PDF worksheets instantly."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MathGenie - Math Problem Generator</title>

    <!-- Resolve the theme before first paint: stored preference wins,
         otherwise follow the system. Keep in sync with src/hooks/useTheme.ts
         (including the theme-color values). -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mathgenie-theme");
        } catch (error) {
          /* Storage unavailable: fall back to the system preference. */
        }
        var dark = stored === "dark";
        if (stored !== "light" && stored !== "dark") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (error) {
            dark = false;
          }
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", dark ? "#0b1220" : "#1e3a8a");
        }
      })();
    </script>

    <!-- Critical CSS: pre-hydration shell only. Keep tokens in sync with
         src/styles/globals.css; component styles live in the bundle. -->
    <style>
      .no-js {
        text-align: center;
        padding: 2rem;
        font-family: system-ui, sans-serif;
      }
      :root {
        color-scheme: light dark;
        --primary-color: #1e3a8a;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #eef2ff;
        --text-primary: #0f172a;
      }
      :root[data-theme="dark"] {
        --primary-color: #93c5fd;
        --bg-secondary: #111a2b;
        --bg-tertiary: #17243a;
        --text-primary: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      .App {
        min-height: 100vh;
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1.5rem;
        text-align: center;
        padding: 2rem;
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      }

      .loading-container h1 {
        margin: 0;
        color: var(--primary-color);
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .loading-container p {
        color: var(--text-primary);
        opacity: 0.7;
        font-size: 1.125rem;
        margin: 0;
      }

      .loading-spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid rgb(148 163 184 / 30%);
        border-radius: 50%;
        border-top-color: var(--primary-color);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .loading-container h1 {
          font-size: 2rem;
        }
      }

      @media (max-width: 480px) {
        .loading-container h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="no-js">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this application.</p>
        <p>MathGenie requires JavaScript to generate math problems and create PDF worksheets.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
