# Keep package-manager and runtime selection under Vite+ control.
pmOnFail: ignore
runtimeOnFail: ignore

# pnpm project settings migrated from .npmrc for pnpm 12.
nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false
storeDir: ${HOME}/.pnpm-store
preferFrozenLockfile: true
enablePrePostScripts: true
shamefullyHoist: true
audit:
  level: moderate
allowBuilds:
  esbuild: true
loglevel: info
overrides:
  glob: ^11.0.3
  rimraf: ^6.0.1
  punycode: "npm:punycode.js@^2.3.1"
  '@babel/plugin-proposal-private-methods': "npm:@babel/plugin-transform-private-methods@^7.27.1"
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  postcss-selector-parser: ^7.1.3
  source-map-js: ^1.2.2
  svgo: ^4.0.2
  esbuild: 0.28.1
  ip-address: 10.3.1
